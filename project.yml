# project.yml
name: MushroomSignal
options:
  bundleIdPrefix: com.alexandersalinka
  deploymentTarget:
    macOS: "14.0"
packages:
  MushroomSignalCore:
    path: MushroomSignalCore
targets:
  MushroomSignal:
    type: application
    platform: macOS
    sources:
      - path: MushroomSignal
    dependencies:
      - target: MushroomSignalWidgetExtension
        embed: true
      - package: MushroomSignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandersalinka.MushroomSignal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UMPK75W8X6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MushroomSignal/MushroomSignal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.alexandersalinka.MushroomSignal
        com.apple.security.network.client: true
    info:
      path: MushroomSignal/Info.plist
      properties:
        CFBundleDisplayName: Mushroom Signal
        LSMinimumSystemVersion: "14.0"

  MushroomSignalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MushroomSignalTests
    dependencies:
      - target: MushroomSignal
      - package: MushroomSignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandersalinka.MushroomSignalTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  MushroomSignalWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MushroomSignalWidget
    dependencies:
      - package: MushroomSignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandersalinka.MushroomSignal.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UMPK75W8X6
    entitlements:
      path: MushroomSignalWidget/MushroomSignalWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.alexandersalinka.MushroomSignal
        com.apple.security.network.client: true
    info:
      path: MushroomSignalWidget/Info.plist
      properties:
        CFBundleDisplayName: Mushroom Signal Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  MushroomSignal:
    build:
      targets:
        MushroomSignal: all
        MushroomSignalTests: [test]
    test:
      targets:
        - MushroomSignalTests
    run:
      config: Debug
    archive:
      config: Release
